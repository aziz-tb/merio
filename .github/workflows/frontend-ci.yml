name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: merio
          POSTGRES_PASSWORD: merio
          POSTGRES_DB: merio
        options: >-
          --health-cmd="pg_isready -U merio"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.24.3"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Build binary and frontend
        run: make build

      - name: Configure app
        run: |
          cp config.sample.toml config.toml
          sed -i 's/host = "db"/host = "127.0.0.1"/' config.toml
          sed -i 's/address = "redis:6379"/address = "localhost:6379"/' config.toml

      - name: Run unit tests for frontend
        run: cd frontend && pnpm test:run

      - name: Verify install + upgrade
        env:
          MERIO_SYSTEM_USER_PASSWORD: "StrongPass!123"
        run: |
          ./merio --install --idempotent-install --yes --config ./config.toml