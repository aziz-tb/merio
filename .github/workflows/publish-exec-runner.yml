name: Publish exec-runner

on:
  push:
    tags:
      - "v*"

env:
  IMAGE: ghcr.io/aziz-tb/merio-exec-runner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exec-runner image
        uses: docker/build-push-action@v6
        with:
          context: ./exec-runner
          file: ./exec-runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=merio-exec-runner
            org.opencontainers.image.description=Merio exec-runner
            org.opencontainers.image.url=https://github.com/aziz-tb/merio
            org.opencontainers.image.source=https://github.com/aziz-tb/merio
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=exec-runner-amd64
          cache-to: type=gha,mode=max,scope=exec-runner-amd64