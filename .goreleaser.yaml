env:
  - GO111MODULE=on
  - CGO_ENABLED=0
  - GITHUB_ORG=aziz-tb

before:
  hooks:
    - go mod tidy
    - make frontend-build

builds:
  - id: "universal"
    main: ./cmd
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - freebsd
      - linux
      - netbsd
      - openbsd
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 6
      - 7
    binary: 'merio{{ if eq .Os "windows" }}.exe{{ end }}'
    ldflags:
      - -s -w -X "main.buildString={{ .Tag }} ({{ .ShortCommit }} {{ .Date }}, {{ .Os }}/{{ .Arch }})" -X "main.versionString={{ .Tag }}"
    hooks:
      post: make stuff BIN={{ .Path }}

  # Temporal worker binary. Built independently of the main app so it
  # can be deployed + scaled on its own cadence. See docs/temporal.md.
  # No stuffbin embedding — the worker has no static assets.
  - id: "temporal-worker"
    main: ./cmd/temporal_worker
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    binary: 'temporal-worker{{ if eq .Os "windows" }}.exe{{ end }}'
    ldflags:
      - -s -w

archives:
  - format: tar.gz
    name_template: 'merio_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if eq .Arch "arm" }}v{{ .Arm }}{{ end }}'
    files:
      - src: config.sample.toml
        dst: config.toml
      - README.md
      - LICENSE

checksum:
  name_template: "merio_{{ .Version }}_checksums.txt"

source:
  enabled: true
  format: tar.gz
  name_template: "merio_{{ .Version }}_source"

dockers:
  # Main app image (linux/amd64)
  - use: buildx
    goos: linux
    goarch: amd64
    ids:
      - universal
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}:latest-amd64"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}:{{ .Tag }}-amd64"
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0
    dockerfile: Dockerfile
    extra_files:
      - config.sample.toml

  # Main app image (linux/arm64)
  - use: buildx
    goos: linux
    goarch: arm64
    ids:
      - universal
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}:latest-arm64"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}:{{ .Tag }}-arm64"
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0
    dockerfile: Dockerfile
    extra_files:
      - config.sample.toml

  # Temporal worker image (linux/amd64)
  - use: buildx
    goos: linux
    goarch: amd64
    ids:
      - temporal-worker
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}-temporal-worker:latest-amd64"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}-temporal-worker:{{ .Tag }}-amd64"
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title={{ .ProjectName }}-temporal-worker
      - --label=org.opencontainers.image.description={{ .ProjectName }} temporal worker
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0
    dockerfile: Dockerfile.temporal-worker
    extra_files:
      - config.sample.toml

  # Temporal worker image (linux/arm64)
  - use: buildx
    goos: linux
    goarch: arm64
    ids:
      - temporal-worker
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}-temporal-worker:latest-arm64"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}-temporal-worker:{{ .Tag }}-arm64"
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.title={{ .ProjectName }}-temporal-worker
      - --label=org.opencontainers.image.description={{ .ProjectName }} temporal worker
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0
    dockerfile: Dockerfile.temporal-worker
    extra_files:
      - config.sample.toml

docker_manifests:
  # Main app multi-arch manifest
  - name_template: ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}:latest
    image_templates:
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}:latest-amd64
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}:latest-arm64
  - name_template: ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}:{{ .Tag }}
    image_templates:
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}:{{ .Tag }}-amd64
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}:{{ .Tag }}-arm64

  # Temporal worker multi-arch manifest
  - name_template: ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}-temporal-worker:latest
    image_templates:
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}-temporal-worker:latest-amd64
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}-temporal-worker:latest-arm64
  - name_template: ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}-temporal-worker:{{ .Tag }}
    image_templates:
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}-temporal-worker:{{ .Tag }}-amd64
      - ghcr.io/{{ .Env.GITHUB_ORG }}/{{ .ProjectName }}-temporal-worker:{{ .Tag }}-arm64

release:
  github:
    owner: aziz-tb
    name: merio
  prerelease: auto
  draft: true