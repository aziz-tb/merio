[app]
# Log level: info, debug, warn, error, fatal
log_level = "debug"
# Environment: dev, prod.
# Setting to "dev" will enable color logging in terminal.
env = "dev"
# Whether to automatically check for application updates on start up, app updates are shown as a banner in the admin panel.
check_updates = true
# Public URL where users access Merio. Used for OAuth callback URLs, public links, and email/template URLs.
# Set this to your production origin, for example: https://merio.io
root_url = "http://localhost:9000"
# Encryption key. Generate using `openssl rand -hex 16` must be 32 characters long.
encryption_key = "your-32-char-random-string-here!"
# Operator-managed function secrets use MERIO_SECRETS_KEK from the
# environment, not this file. Generate it with: openssl rand -base64 32
# Path to a directory with custom static files and templates to override the defaults.
# The directory structure should mirror the built-in static/ directory.
# Only the files you provide will be replaced; the rest use built-in defaults.
# static_dir = "/path/to/custom/static"

# HTTP server.
[app.server]
# Address to bind the HTTP server to.
address = "0.0.0.0:9000"
# Unix socket path (leave empty to use TCP address instead)
socket = ""
# Do NOT disable secure cookies in production environment if you don't know exactly what you're doing!
disable_secure_cookies = false
# Session lifetime duration.
session_lifetime = "9h"
# Request read and write timeouts.
read_timeout = "5s"
write_timeout = "90s"
# Maximum request body size in bytes (100MB)
# If you are using proxy, you may need to configure them to allow larger request bodies.
max_body_size = 104857600
# Size of the read buffer for incoming requests (also limits max header size).
read_buffer_size = 65536
# Keepalive settings.
keepalive_timeout = "10s"

# File upload provider to use, either `fs` or `s3`.
[upload]
provider = "fs"

# Filesystem provider.
[upload.fs]
# Directory where uploaded files are stored, make sure this directory exists and is writable by the application.
upload_path = 'uploads'

# S3 provider.
[upload.s3]
# S3 endpoint URL (required only for non-AWS S3-compatible providers like MinIO).
# Leave empty to use default AWS endpoints.
url = ""

# AWS S3 credentials, keep empty to use attached IAM roles.
access_key = ""
secret_key = ""

# AWS region, e.g., "us-east-1", "eu-west-1", etc.
region = "ap-south-1"
# S3 bucket name where files will be stored.
bucket = "bucket-name"
# Optional prefix path within the S3 bucket where files will be stored.
# Example, if set to "uploads/media", files will be stored under that path.
# Useful for organizing files inside a shared bucket.
bucket_path = ""
# S3 signed URL expiry duration (e.g., "30m", "1h")
expiry = "30m"

# Postgres.
[db]
# If running locally, use `localhost`.
host = "db"
# Database port, default is 5432.
port = 5432
# Update the following values with your database credentials.
user = "merio"
password = "merio"
database = "merio"
ssl_mode = "disable"
# Maximum number of open database connections
max_open = 30
# Maximum number of idle connections in the pool
max_idle = 30
# Maximum time a connection can be reused before being closed
max_lifetime = "300s"

# Redis.
[redis]
# url parameter overrides other redis config options
# url = "redis://user:password@host:port/db"
# If running locally, use `localhost:6379`.
address = "redis:6379"
user = ""
password = ""
db = 0

[message]
# Number of workers processing outgoing message queue
outgoing_queue_workers = 10
# Number of workers processing incoming message queue
incoming_queue_workers = 10
# How often to scan for outgoing messages to process, keep it low to process messages quickly.
message_outgoing_scan_interval = "50ms"
# Maximum number of messages that can be queued for incoming processing
incoming_queue_size = 5000
# Maximum number of messages that can be queued for outgoing processing
outgoing_queue_size = 5000

[notification]
# Number of concurrent notification workers
concurrency = 2
# Maximum number of notifications that can be queued
queue_size = 2000

[automation]
# Number of workers processing automation rules
worker_count = 10

[autoassigner]
# How often to run automatic conversation assignment
autoassign_interval = "5m"

[webhook]
# Number of webhook delivery workers
workers = 5
# Maximum number of webhook deliveries that can be queued
queue_size = 10000
# HTTP timeout for webhook requests
timeout = "15s"
# CIDR ranges allowed to bypass SSRF protection (e.g. ["10.0.0.0/8"])
allowed_hosts = []

[conversation]
# How often to check for conversations to unsnooze
unsnooze_interval = "5m"
# How long to keep drafts before deleting them from the database. (e.g. "360h", "48h")
draft_retention_period = "360h"
# How often to check for offline conversations in database to send continuity emails
continuity_scan_interval = "5m"

[sla]
# How often to evaluate SLA compliance for conversations
evaluation_interval = "5m"

[exec]
# Sandbox HTTP endpoint (the Python exec-runner service).
# Override with MERIO_EXEC__SANDBOX_URL in compose:
#   - Mac/dev host runner: http://host.docker.internal:8090
#   - VPS Docker runner:  http://exec-runner:8090
sandbox_url = "http://localhost:8090"

# Shared service token authorizing this Go binary to call exec-runner.
# Must match the SERVICE_TOKEN env var on the Python service.
# Override with MERIO_EXEC__SANDBOX_TOKEN in compose.
# Generate with: openssl rand -hex 32
sandbox_token = "<replace-with-openssl-rand-hex-32>"

# Where exec-runner sends scripts' SDK callbacks.
# Override with MERIO_EXEC__PLATFORM_BASE_URL in compose:
#   - Mac/dev host runner: http://<host-lan-ip>:9000
#   - VPS Docker runner:  http://merio_app:9000
platform_base_url = "http://localhost:9000"

# Temporal — durable workflow infrastructure. Used by all async work
# going forward: KB embedding indexing, inbound AI pipeline,
# SLA timers, etc.
#
# When enabled = false, the main app starts cleanly without Temporal
# running; workflow-starting code paths fall back to sync or refuse
# loudly. See internal/temporal/CONVENTIONS.md.
[temporal]
enabled = false
# Frontend gRPC address. "temporal:7233" inside docker-compose,
# "127.0.0.1:7233" for local dev outside compose.
address = "temporal:7233"
namespace = "merio"
# Caps how long client.Dial may block at startup.
dial_timeout = "10s"
# Time the worker is given to drain in-flight activities after
# SIGINT/SIGTERM before the process exits.
shutdown_grace = "30s"

# Per-task-queue worker pool tuning. Queue names match the constants
# in internal/temporal/queues.go. Zero-valued fields are filled in
# with sensible per-queue defaults (30 activities, 100 workflows).
[temporal.workers.embeddings]
max_concurrent_activities = 30
max_concurrent_workflows = 100

[temporal.workers.pipeline]
max_concurrent_activities = 20
max_concurrent_workflows = 50

[temporal.workers.ai-runs]
max_concurrent_activities = 10
max_concurrent_workflows = 30

[temporal.workers.sla-timers]
max_concurrent_activities = 5
max_concurrent_workflows = 100

[temporal.workers.default]
max_concurrent_activities = 10
max_concurrent_workflows = 30

# Agent-run live progress. Controls the Redis event stream and the SSE
# channel that surface live agent-run progress to the admin UI.
[agent_run]
# How long agent-run event streams are retained in Redis.
event_ttl = "1h"
# Interval between SSE keepalive comments sent to the browser. Lower this
# if a proxy buffers or severs idle connections.
sse_keepalive = "15s"
# After a run completes, how long the run-state endpoint keeps reporting
# it as "completed" to clients that reconnect.
recent_completion_window = "10m"

# RAG, embeddings, and semantic search.
#
# Provider keys for Voyage live in config/ai_presets.json under
# provider_keys.voyage (same pattern as the Anthropic key). Leave it
# empty to disable the hybrid kb_search path — the capability returns a
# clear error at invocation time.
[embeddings]
provider = "voyage"
model = "voyage-3-large"
dimensions = 1024
concurrency = 10
total_timeout = "30s"

# Per-chunk cosine similarity threshold applied before RRF fusion.
# Chunks whose semantic similarity to the query is below this value are
# dropped before fusion + reranking. Set to 0.0 to disable filtering
# (default). Tune after observing real similarity values in trace JSON.
min_semantic_similarity = 0.0

# Reranker score threshold applied after Voyage rerank-2 returns.
# Articles whose reranker score is below this are dropped before the
# results reach the agent. 0.3 is a conservative default. Set to 0.0
# to disable.
min_reranker_score = 0.3

# Query embedding cache (Redis-backed). Disabling makes every kb_search
# call hit Voyage again — fine for dev, wasteful in prod.
[embeddings.cache]
enabled = true
ttl = "1h"

[reranker]
provider = "voyage"
model = "rerank-2"
concurrency = 5
total_timeout = "30s"
