# dev.merio.io - reserved for future staging.

server {
    listen 80;
    server_name dev.merio.io;
    return 301 https://dev.merio.io$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev.merio.io;

    ssl_certificate /etc/ssl/cloudflare/merio.io.pem;
    ssl_certificate_key /etc/ssl/cloudflare/merio.io.key;

    return 404;
}
