services:
  # Merio app.
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        VERSION: ${VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: merio_app
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      MERIO_SYSTEM_USER_PASSWORD: ${MERIO_SYSTEM_USER_PASSWORD:-}
      MERIO_SECRETS_KEK: ${MERIO_SECRETS_KEK:?set MERIO_SECRETS_KEK to openssl rand -base64 32}
      MERIO_EXEC__SANDBOX_URL: ${SANDBOX_URL:-http://host.docker.internal:8090}
      MERIO_EXEC__PLATFORM_BASE_URL: ${PLATFORM_BASE_URL:-http://localhost:9000}
      # AI provider keys. Seeded from env as a fallback; stored secrets win.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_FOUNDRY_ENDPOINT: ${AZURE_FOUNDRY_ENDPOINT:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - merio
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./uploads:/merio/uploads:rw
      - ./config.toml:/merio/config.toml
      - ./config:/merio/config:ro
    healthcheck:
      # Hits a known-cheap endpoint. If 9000 doesn't respond, the app
      # is considered unhealthy and restart policy applies.
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command: [sh, -c, "./merio --install --idempotent-install --yes --config /merio/config.toml && ./merio --upgrade --yes --config /merio/config.toml && ./merio --config /merio/config.toml"]

  # Exec-runner sandbox service.
  #
  # This profile is for Linux hosts with /dev/kvm. macOS Docker Desktop does
  # not expose KVM, so local Mac development keeps using a host uv process.
  exec-runner:
    profiles:
      - linux-kvm
    build: ./exec-runner
    container_name: merio_exec_runner
    restart: unless-stopped
    networks:
      - merio
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${KVM_GID:-109}"
    environment:
      SERVICE_TOKEN: ${EXEC_RUNNER_TOKEN:-devsecret}
      WARM_POOL_SIZE_PYTHON: ${EXEC_WARM_POOL_PYTHON:-5}
      WARM_POOL_SIZE_JS: ${EXEC_WARM_POOL_JS:-0}
      WARM_POOL_SIZE_RAW: ${EXEC_WARM_POOL_RAW:-0}
      DEFAULT_MEMORY_MB: ${EXEC_VM_MEMORY:-256}
      DEFAULT_TIMEOUT_SECONDS: ${EXEC_TIMEOUT:-60}
      EXEC_SANDBOX_OFFLINE: "1"
      LOG_LEVEL: ${EXEC_LOG_LEVEL:-INFO}
      LOG_FORMAT: json
    volumes:
      - exec-sandbox-cache:/root/.cache/exec-sandbox
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 3G
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8090/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 90s

  # PostgreSQL — main application database.
  db:
    image: pgvector/pgvector:pg17
    container_name: merio_db
    restart: unless-stopped
    networks:
      - merio
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-merio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-merio}
      POSTGRES_DB: ${POSTGRES_DB:-merio}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-merio} -d ${POSTGRES_DB:-merio}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Redis.
  redis:
    image: redis:7-alpine
    container_name: merio_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - merio
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Temporal Postgres (dedicated; separate from the app's main DB).
  temporal-postgresql:
    image: postgres:17-alpine
    container_name: merio_temporal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_DB: temporal
    networks:
      - merio
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - temporal-postgresql-data:/var/lib/postgresql/data
      - ./config/temporal/temporal-init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Temporal server (dev/local pattern via auto-setup image).
  temporal:
    image: temporalio/auto-setup:1.29
    container_name: merio_temporal
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_SEEDS: temporal-postgresql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      DEFAULT_NAMESPACE: merio
      DEFAULT_NAMESPACE_RETENTION: 30d
    networks:
      - merio
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:9090:9090"
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    volumes:
      - ./config/temporal:/etc/temporal/config/dynamicconfig:ro

  # Temporal Web UI.
  temporal-ui:
    image: temporalio/ui:2.32.0
    container_name: merio_temporal_ui
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    networks:
      - merio
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - temporal

  # Temporal worker.
  #
  # Now version-stamped via build args and depends on the main DB
  # being healthy (worker activities read from merio DB, not just
  # Temporal's own DB). Healthcheck verifies the worker can reach
  # Temporal; if Temporal is down or the worker has crashed, restart
  # policy kicks in.
  temporal-worker:
    build:
      context: .
      dockerfile: Dockerfile.temporal-worker.dev
      args:
        VERSION: ${VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: merio_temporal_worker
    restart: unless-stopped
    environment:
      MERIO_TEMPORAL__ENABLED: "true"
      MERIO_TEMPORAL__ADDRESS: "temporal:7233"
      MERIO_TEMPORAL__NAMESPACE: "merio"
      MERIO_SECRETS_KEK: ${MERIO_SECRETS_KEK:?set MERIO_SECRETS_KEK to openssl rand -base64 32}
      MERIO_EXEC__SANDBOX_URL: ${SANDBOX_URL:-http://host.docker.internal:8090}
      MERIO_EXEC__PLATFORM_BASE_URL: ${PLATFORM_BASE_URL:-http://localhost:9000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_FOUNDRY_ENDPOINT: ${AZURE_FOUNDRY_ENDPOINT:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    volumes:
      - ./config.toml:/worker/config.toml:ro
      - ./config:/worker/config:ro
    networks:
      - merio
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z temporal 7233 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  merio:

volumes:
  postgres-data:
  redis-data:
  temporal-postgresql-data:
  exec-sandbox-cache:
